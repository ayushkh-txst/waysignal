name: WaySignalRecording
options:
  bundleIdPrefix: org.waysignal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENTITLEMENTS_REQUIRED: YES
targets:
  WaySignal:
    type: application
    platform: iOS
    sources:
      - path: ../WaySignal
        excludes:
          - "Info-*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.waysignal.ios
        INFOPLIST_FILE: ../WaySignal/Info-Debug.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  WalkthroughUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WalkthroughUITests.swift]
    dependencies:
      - target: WaySignal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaySignal
schemes:
  WaySignalRecording:
    build:
      targets:
        WaySignal: all
        WalkthroughUITests: [test]
    test:
      targets: [WalkthroughUITests]
      gatherCoverageData: false
